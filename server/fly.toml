app = "amanah-api"
# yyz (Toronto), not yul (Montreal) — the plan's original choice. yul is
# deprecated on Fly and cannot provision new resources as of this deploy
# (confirmed directly: `fly deploy` refused with "Region yul is deprecated").
# Still Canada, still close to Supabase's ca-central-1 — the actual intent
# (data-minimization, not a specific-city requirement) is unaffected.
primary_region = "yyz"

[build]

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  method = "GET"
  path = "/api/health"
  interval = "15s"
  timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
